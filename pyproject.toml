[project]
name = "kestrelgrid-analysis"
version = "0.1.0"
description = "Notebook-based KGRID waveform and measurement exploration"
requires-python = ">=3.12"
dependencies = [
  "kestrelgrid==0.1.0",
  "requests>=2.32,<3",
  "truststore>=0.10,<1",
  "beautifulsoup4>=4.12,<5",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18",
  "jupyterlab>=4,<5",
  "ipywidgets>=8,<9",
  "anywidget>=0.9,<1",
  "plotly>=6.1,<7",
  "kaleido>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11", "nbclient>=0.10", "nbformat>=5"]

[project.scripts]
kgrid-notebook = "kestrelgrid_tools.launch:main"
kgrid-migrate = "kestrelgrid_tools.storage:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kestrelgrid_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D100", "D101", "D102", "D103", "D104", "D105", "D107"]
